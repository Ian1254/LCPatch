name: Apply navigation refactor

on:
  push:
    branches:
      - navigation/continuous-bottom-bar
    paths:
      - .github/workflows/apply-navigation-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: navigation/continuous-bottom-bar
          fetch-depth: 0
      - name: Rewrite navigation host
        run: python3 .github/scripts/apply_navigation_refactor.py
      - name: Commit refactor
        run: |
          rm -f .github/navigation-refactor.patch
          rm -f .github/scripts/apply_navigation_refactor.py
          rm -f .github/workflows/apply-navigation-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: unify bottom navigation and page transitions"
          git push origin HEAD:navigation/continuous-bottom-bar
