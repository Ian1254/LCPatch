name: Apply navigation refactor

on:
  push:
    branches:
      - navigation/continuous-bottom-bar
    paths:
      - .github/navigation-refactor.patch
      - .github/workflows/apply-navigation-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[navigation-refactor-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: navigation/continuous-bottom-bar
          fetch-depth: 0
      - name: Apply patch
        run: |
          git apply --check .github/navigation-refactor.patch
          git apply .github/navigation-refactor.patch
      - name: Commit refactor
        run: |
          rm .github/navigation-refactor.patch
          rm .github/workflows/apply-navigation-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: unify bottom navigation and page transitions [navigation-refactor-applied]"
          git push origin HEAD:navigation/continuous-bottom-bar
