name: Apply UI color and glass fix

on:
  push:
    branches:
      - fix/restore-colors-black-glass-topbar
    paths:
      - .github/workflows/apply-ui-color-glass-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply focused source edits
        run: python tools/apply_ui_fix.py

      - name: Verify patch formatting
        run: |
          git diff --check
          git diff -- app/src/main/java/com/filepermwebui/MainActivity.kt app/src/main/java/com/filepermwebui/EnvironmentStatusCard.kt

      - name: Commit focused source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/filepermwebui/MainActivity.kt app/src/main/java/com/filepermwebui/EnvironmentStatusCard.kt
          git commit -m "Restore app colors and wire black glass top bar"
          git push origin HEAD:fix/restore-colors-black-glass-topbar
