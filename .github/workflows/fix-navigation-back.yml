name: Fix navigation back fallback

on:
  push:
    branches:
      - navigation/continuous-bottom-bar
    paths:
      - .github/workflows/fix-navigation-back.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: navigation/continuous-bottom-bar
          fetch-depth: 0
      - name: Preserve top-level back behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/filepermwebui/MainActivity.kt')
          t = p.read_text()
          old = '                page = parentPage(page)\n'
          new = '                page = if (page == SETTINGS || page == LOGS) OVERVIEW else parentPage(page)\n'
          if t.count(old) != 1:
              raise SystemExit(f'Expected one fallback assignment, found {t.count(old)}')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          rm .github/workflows/fix-navigation-back.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve top-level back navigation"
          git push origin HEAD:navigation/continuous-bottom-bar
