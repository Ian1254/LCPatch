name: Android Release

on:
  push:
    branches: [main]
    paths:
      - 'version.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Resolve release version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^VERSION_NAME=//p' version.properties | head -n1 | tr -d '\r')"
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' version.properties | head -n1 | tr -d '\r')"
          test -n "$VERSION" || { echo 'VERSION_NAME is empty'; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid VERSION_NAME: $VERSION"
            exit 1
          }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || {
            echo "Invalid VERSION_CODE: $VERSION_CODE"
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Check for existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "Release $RELEASE_TAG already exists; skipping duplicate release."
              echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            else
              echo "Release $RELEASE_TAG already exists. Bump version.properties before publishing again."
              exit 1
            fi
          else
            echo "SKIP_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Run shared Android validation
        if: env.SKIP_RELEASE != 'true'
        uses: ./.github/actions/android-build

      - name: Sign release
        if: env.SKIP_RELEASE != 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LCPATCH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LCPATCH_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LCPATCH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LCPATCH_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing LCPATCH_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing LCPATCH_STORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing LCPATCH_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing LCPATCH_KEY_PASSWORD'; exit 1; }
          mkdir -p build/ci-signing dist
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build/ci-signing/lcpatch.p12
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -P 16 -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk build/ci-signing/aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks build/ci-signing/lcpatch.p12 --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
            --out "dist/LCPatch-$VERSION.apk" build/ci-signing/aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/LCPatch-$VERSION.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 4 "dist/LCPatch-$VERSION.apk"
          sha256sum "dist/LCPatch-$VERSION.apk" > "dist/LCPatch-$VERSION.apk.sha256"

      - name: Publish GitHub Release
        if: env.SKIP_RELEASE != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/LCPatch-$VERSION.apk" \
            "dist/LCPatch-$VERSION.apk.sha256" \
            --title "LCPatch $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            "${PRERELEASE_ARGS[@]}"

      - name: Keep latest prerelease and beta.15 fallback
        if: env.SKIP_RELEASE != 'true' && contains(env.VERSION, '-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRESERVED_TAG="v1.2.1-beta.15"
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq ".[] | select(.isPrerelease == true and .tagName != \"$RELEASE_TAG\" and .tagName != \"$PRESERVED_TAG\") | .tagName" |
          while IFS= read -r OLD_TAG; do
            test -n "$OLD_TAG" || continue
            echo "Removing old prerelease $OLD_TAG"
            gh release delete "$OLD_TAG" --cleanup-tag --yes
          done
