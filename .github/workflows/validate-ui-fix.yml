name: Validate UI fix

on:
  push:
    branches:
      - fix/restore-colors-black-glass-topbar
    paths:
      - .github/workflows/validate-ui-fix.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run shared Android validation
        uses: ./.github/actions/android-build
