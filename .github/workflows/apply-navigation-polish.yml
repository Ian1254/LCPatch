name: Apply navigation polish

on:
  push:
    branches: ["polish/navigation-and-status-card"]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out polish branch
        uses: actions/checkout@v6
        with:
          ref: polish/navigation-and-status-card

      - name: Replace expandable status card with overlay entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/filepermwebui/MainActivity.kt')
          text = path.read_text(encoding='utf-8')
          start_marker = '        item {\n            var environmentExpanded by rememberSaveable { mutableStateOf(false) }'
          end_marker = '        item {\n            Card(insideMargin = PaddingValues(18.dp)) {\n                Text("當前漢化", style = MiuixTheme.textStyles.title2)'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Environment card markers not found; refusing to rewrite MainActivity.kt')

          replacement = '''        item {
              EnvironmentStatusOverviewCard(
                  scopeStatus = scopeStatus,
                  rootStatus = rootStatus,
                  gameInstalled = game.installed,
                  gameVersion = game.version,
                  onCheckScope = onCheckScope,
                  onRequestRoot = onRequestRoot
              )
          }
'''
          updated = text[:start] + replacement + text[end:]
          updated = updated.replace('import androidx.compose.animation.animateContentSize\n', '')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit generated polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/filepermwebui/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No rewrite needed"
            exit 0
          fi
          git commit -m "polish environment status card transition"
          git push origin HEAD:polish/navigation-and-status-card
