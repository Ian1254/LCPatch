name: Apply beta8 source refactor

on:
  push:
    branches:
      - refactor/beta8-navigation-core
    paths:
      - tools/apply_beta8_refactor.py
      - .github/workflows/apply-beta8-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: refactor/beta8-navigation-core
          fetch-depth: 0
      - name: Apply deterministic refactor
        run: python3 tools/apply_beta8_refactor.py
      - name: Remove temporary refactor tooling
        run: git rm tools/apply_beta8_refactor.py .github/workflows/apply-beta8-refactor.yml
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/filepermwebui
          git commit -m 'refactor: apply beta8 navigation and infrastructure cleanup'
          git push origin HEAD:refactor/beta8-navigation-core
