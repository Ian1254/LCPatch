              env,
              '''    fun openOverlay() {\n        if (overlayMounted) return\n        closing = false\n        overlayMounted = true\n        overlayVisible = true\n    }\n\n    fun closeOverlay() {\n        if (!overlayMounted || closing) return\n        closing = true\n        overlayVisible = false\n    }\n''',
              '''    fun openOverlay() {\n        if (overlayMounted) return\n        frozenSourceBounds = sourceBounds\n        closing = false\n        overlayMounted = true\n        overlayVisible = true\n    }\n\n    fun closeOverlay() {\n        if (!overlayMounted || closing) return\n        // Freeze one final source rectangle at the start of closing. The target cannot drift\n        // while the overlay is morphing back into it.\n        frozenSourceBounds = sourceBounds\n        closing = true\n        overlayVisible = false\n    }\n''',
              'EnvironmentStatusCard open/close'
          )
          env = replace_once(
              env,
              '            .onGloballyPositioned { sourceBounds = it.boundsInWindow() }\n',
              '''            .onGloballyPositioned { coordinates ->\n                val bounds = coordinates.boundsInWindow()\n                val origin = IntArray(2)\n                hostView.rootView.getLocationOnScreen(origin)\n                sourceBounds = Rect(\n                    left = bounds.left + origin[0],\n                    top = bounds.top + origin[1],\n                    right = bounds.right + origin[0],\n                    bottom = bounds.bottom + origin[1]\n                )\n            }\n''',
              'EnvironmentStatusCard source measurement'
          )
          env = replace_once(
              env,
              '            sourceBounds = sourceBounds,\n',
              '            sourceBounds = frozenSourceBounds,\n',
              'EnvironmentStatusCard frozen bounds argument'
          )
          env = replace_once(
              env,
              '''    Dialog(\n        onDismissRequest = onDismiss,\n        properties = DialogProperties(\n''',
              '''    Dialog(\n        onDismissRequest = onDismiss,\n        properties = DialogProperties(\n''',
              'EnvironmentStatusCard dialog anchor'
          )
          env = replace_once(
              env,
              '''    ) {\n        val dialogWindow = (LocalView.current.parent as? DialogWindowProvider)?.window\n        SideEffect {\n            dialogWindow?.setDimAmount(0f)\n            dialogWindow?.clearFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND)\n        }\n\n        BoxWithConstraints(\n''',
              '''    ) {\n        val dialogView = LocalView.current\n        val dialogWindow = (dialogView.parent as? DialogWindowProvider)?.window\n        var dialogOrigin by remember(dialogView) { mutableStateOf(Offset.Zero) }\n        SideEffect {\n            dialogWindow?.setDimAmount(0f)\n            dialogWindow?.clearFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND)\n            val origin = IntArray(2)\n            dialogView.rootView.getLocationOnScreen(origin)\n            dialogOrigin = Offset(origin[0].toFloat(), origin[1].toFloat())\n        }\n\n        BoxWithConstraints(\n''',
              'EnvironmentStatusCard dialog origin'
          )
          env = replace_once(
              env,
              '''            val hasMeasuredSource = sourceBounds.width > 0f && sourceBounds.height > 0f\n            val sourceLeft = if (hasMeasuredSource) with(density) { sourceBounds.left.toDp() } else 12.dp\n            val sourceTop = if (hasMeasuredSource) with(density) { sourceBounds.top.toDp() } else 76.dp\n            val sourceWidth = if (hasMeasuredSource) with(density) { sourceBounds.width.toDp() } else maxWidth - 24.dp\n            val sourceHeight = if (hasMeasuredSource) with(density) { sourceBounds.height.toDp() } else 142.dp\n''',
              '''            val hasMeasuredSource = sourceBounds.width > 0f && sourceBounds.height > 0f\n            val sourceLeft = if (hasMeasuredSource) {\n                with(density) { (sourceBounds.left - dialogOrigin.x).toDp() }\n            } else 12.dp\n            val sourceTop = if (hasMeasuredSource) {\n                with(density) { (sourceBounds.top - dialogOrigin.y).toDp() }\n            } else 76.dp\n            val sourceWidth = if (hasMeasuredSource) with(density) { sourceBounds.width.toDp() } else maxWidth - 24.dp\n            val sourceHeight = if (hasMeasuredSource) with(density) { sourceBounds.height.toDp() } else 142.dp\n''',
              'EnvironmentStatusCard coordinate conversion'
          )
          env_path.write_text(env, encoding='utf-8')

          # --- Main screen: top-level pages no longer build a titled SmallTopAppBar. ---
          main_path = Path('app/src/main/java/com/filepermwebui/MainActivity.kt')
          main = main_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'''                    topBar = \{\n.*?                    \},\n                    bottomBar = \{''',
              re.S
          )
          replacement = '''                    topBar = {\n                        if (topLevelScreen) {\n                            TopLevelBlurBar(activeBarBackdrop)\n                        } else {\n                            TintedBar(activeBarBackdrop) {\n                                val navigationIcon: @Composable () -> Unit = {\n                                    if (visiblePage != ONBOARDING || onboardingDone) {\n                                        IconButton(onClick = ::navigateBack) {\n                                            Icon(MiuixIcons.Back, contentDescription = "返回")\n                                        }\n                                    }\n                                }\n                                SmallTopAppBar(\n                                    title = visibleTitle,\n                                    color = Color.Transparent,\n                                    scrollBehavior = visibleScrollBehavior,\n                                    navigationIcon = navigationIcon\n                                )\n                            }\n                        }\n                    },\n                    bottomBar = {'''
          main, count = pattern.subn(replacement, main, count=1)
          if count != 1:
              raise SystemExit(f'MainActivity topBar: expected exactly one match, found {count}')
          main_path.write_text(main, encoding='utf-8')
          PY

