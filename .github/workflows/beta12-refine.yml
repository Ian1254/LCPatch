name: Apply beta12 interaction refinements

on:
  push:
    branches:
      - fix/beta12-motion-handoff
    paths:
      - .github/workflows/beta12-refine.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta12-motion-handoff
          fetch-depth: 0

      - name: Apply refinements
        run: python3 .github/beta12_patch.py

      - name: Check diff
        run: |
          git diff --check
          git diff --stat

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Gradle project
        run: ./gradlew test lint --stacktrace

      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/filepermwebui/TintedBar.kt \
                  app/src/main/java/com/filepermwebui/SukiFloatingBottomBar.kt \
                  app/src/main/java/com/filepermwebui/EnvironmentStatusCard.kt \
                  app/src/main/java/com/filepermwebui/MainActivity.kt
          git commit -m "Fix beta12 navigation, blur, and card handoff"
          git push origin HEAD:fix/beta12-motion-handoff
