name: Apply beta12 interaction refinements

on:
  push:
    branches:
      - fix/beta12-motion-handoff
    paths:
      - .github/workflows/beta12-refine.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta12-motion-handoff
          fetch-depth: 0

      - name: Apply refinements
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # --- Top bar: separate top-level blur treatment from inner app bars. ---
          tinted = Path('app/src/main/java/com/filepermwebui/TintedBar.kt')
          tinted.write_text(r'''package com.lcpatch

import androidx.compose.foundation.background
import androidx.compose.foundation.layout.Box
import androidx.compose.foundation.layout.WindowInsets
