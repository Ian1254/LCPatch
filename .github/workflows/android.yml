name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build open-source native core
        shell: bash
        run: |
          cmake -S native-refactor -B native-refactor/build-ci -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build native-refactor/build-ci --target lcpatch_core --parallel
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native-refactor/build-ci/liblcpatch_core.so app/src/main/jniLibs/arm64-v8a/liblcpatch_core.so
          "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-all app/src/main/jniLibs/arm64-v8a/liblcpatch_core.so

      - name: Test and assemble
        run: ./gradlew --no-daemon testDebugUnitTest lintVitalRelease assembleRelease

      - name: Upload unsigned APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: LCPatch-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Sign tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LCPATCH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LCPATCH_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LCPATCH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LCPATCH_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing LCPATCH_KEYSTORE_BASE64'; exit 1; }
          mkdir -p build/ci-signing dist
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build/ci-signing/lcpatch.p12
          VERSION="${GITHUB_REF_NAME#v}"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -P 16 -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk build/ci-signing/aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks build/ci-signing/lcpatch.p12 --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
            --out "dist/LCPatch-$VERSION.apk" build/ci-signing/aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "dist/LCPatch-$VERSION.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 4 "dist/LCPatch-$VERSION.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/LCPatch-$VERSION.apk" --generate-notes --verify-tag
